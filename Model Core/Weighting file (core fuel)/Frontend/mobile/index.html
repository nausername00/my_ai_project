<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#10131c" />
  <title>墨灵 · 移动陪伴</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="identity">
      <span class="dot" id="statusDot"></span>
      <strong id="companionName">墨灵</strong>
    </div>
    <span class="model" id="modelLabel">…</span>
  </header>

  <main class="chat" id="chatLog" aria-live="polite">
    <div class="bubble bot" id="welcome">嗨～我是墨灵，想聊点什么？</div>
  </main>

  <form class="composer" id="composer">
    <textarea id="input" rows="1" placeholder="输入消息…" autocomplete="off"></textarea>
    <button type="submit" id="sendBtn" aria-label="发送">发送</button>
  </form>

  <script src="app.js"></script>
</body>
</html>
