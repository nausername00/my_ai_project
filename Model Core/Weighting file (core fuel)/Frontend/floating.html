<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>墨小灵 · 悬浮窗</title>
<script src="./vendor/live2dcubismcore.min.js"></script>
<script src="./vendor/live2d-runtime.js"></script>
<script src="./live2d-avatar.js"></script>
<style>
  :root {
    --panel-bg: rgba(22, 24, 32, 0.78);
    --panel-border: rgba(255, 255, 255, 0.08);
    --text: #e8eaf0;
    --text-dim: #9aa3b2;
    --accent: #7c6fff;
    --success: #22c55e;
    --warn: #f59e0b;
    --error: #ef4444;
    --info: #3b82f6;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    color: var(--text);
    background: transparent;
    user-select: none;
    overflow: hidden;
  }
  #panel {
    position: absolute;
    inset: 0;
    border-radius: 22px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    display: flex;
    flex-direction: column;
    padding: 10px 12px 12px;
    -webkit-app-region: drag;
  }
  #drag-handle {
    -webkit-app-region: drag;
    height: 18px;
    flex: 0 0 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 2px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    opacity: 0.85;
    box-shadow: 0 0 8px rgba(124, 111, 255, 0.8);
  }
  #toolbar { -webkit-app-region: no-drag; display: flex; gap: 6px; }
  .tool-btn {
    width: 20px; height: 20px; border-radius: 50%;
    border: 1px solid var(--panel-border);
    background: rgba(255,255,255,0.04);
    color: var(--text-dim);
    font-size: 11px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .tool-btn:hover { color: var(--text); background: rgba(255,255,255,0.08); }

  #body {
    flex: 1 1 auto;
    display: flex;
    gap: 10px;
    min-height: 0;
    margin-top: 4px;
    position: relative;
  }

  /* 互动工具菜单：点击头像弹出（摸头/打招呼/聊话题/看造型/窗口操作） */
  .interact-menu {
    position: absolute;
    left: 6px;
    top: 74px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 158px;
    padding: 6px;
    background: rgba(26, 28, 38, 0.96);
    border: 1px solid rgba(155, 140, 255, 0.3);
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    z-index: 30;
    -webkit-app-region: no-drag;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  #panel.expanded .interact-menu { top: 360px; }
  #panel.expanded .interact-menu {
    top: 360px;
    /* 展开态纵向菜单：项数增加后允许滚动，避免超出窗口底部 */
    max-height: 240px;
    overflow-y: auto;
  }
  #panel.expanded .interact-menu::-webkit-scrollbar { width: 4px; }
  #panel.expanded .interact-menu::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.12);
    border-radius: 2px;
  }
  .interact-menu button {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 6px 10px;
    border: none;
    border-radius: 9px;
    background: transparent;
    color: var(--text);
    font-size: 12.5px;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
    transition: background 140ms ease, transform 120ms ease;
  }
  .interact-menu button:hover { background: rgba(155, 140, 255, 0.18); transform: translateX(2px); }
  .interact-menu .menu-sep {
    height: 1px;
    margin: 3px 4px;
    background: rgba(255, 255, 255, 0.08);
  }
  .interact-menu[hidden] { display: none; }
  #panel:not(.expanded) .interact-menu {
    left: 0;
    right: 0;
    top: 0;
    width: 100%;
    min-width: 0;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    align-content: center;
    gap: 2px;
  }
  #panel:not(.expanded) .interact-menu[hidden] { display: none; }
  #panel:not(.expanded) .interact-menu button {
    min-height: 24px;
    padding: 3px 6px;
    gap: 4px;
    font-size: 11px;
  }
  #panel:not(.expanded) .interact-menu .menu-sep { display: none; }

  #avatar-wrap {
    flex: 0 0 56px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #9f90ff, #4d3fd8 70%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 20px rgba(124, 111, 255, 0.45);
    overflow: hidden;
    font-size: 26px;
    font-weight: 700;
    color: white;
    text-shadow: 0 1px 2px rgba(0,0,0,0.35);
    cursor: pointer;
    -webkit-app-region: no-drag;
    /* 尺寸平滑过渡：展开/折叠时避免角色在窗口 resize 完成前被裁切/跳动 */
    transition: transform 0.15s ease, width 0.22s ease, height 0.22s ease,
      border-radius 0.22s ease, background 0.22s ease, box-shadow 0.22s ease;
  }
  #avatar-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  #avatar-wrap.expanded-live2d img { display: none; }
  #avatar-wrap.expanded-live2d #avatar-text { display: none; }
  #avatar-live2d {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
  }
  #avatar-wrap.expanded-live2d #avatar-live2d {
    display: flex;
  }
  #avatar-live2d canvas {
    width: 100% !important;
    height: 100% !important;
    object-fit: contain;
  }
  #avatar-wrap:hover { transform: scale(1.05); }
  /* 墨灵生活状态机：睡觉变暗缓息 / 低电趴着 / 醒来提亮 */
  #avatar-wrap.life-sleeping { filter: brightness(0.85) saturate(0.75); }
  #avatar-wrap.life-low { filter: brightness(0.68) saturate(0.5); }
  #avatar-wrap.life-waking,
  #avatar-wrap.life-waking-clean,
  #avatar-wrap.life-waking-unclean { filter: brightness(1.08); }
  #avatar-wrap.listening {
    animation: pulse 1.2s ease-in-out infinite;
  }
  #panel:not(.expanded) #avatar-wrap:not(.listening) {
    animation: companion-breathe 4.5s ease-in-out infinite;
  }
  @keyframes companion-breathe {
    0%, 100% { box-shadow: 0 0 14px var(--mood-halo, #7c6fff); }
    50% { box-shadow: 0 0 23px var(--mood-halo, #7c6fff); }
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 20px rgba(124, 111, 255, 0.45); }
    50% { box-shadow: 0 0 28px rgba(124, 111, 255, 0.85); }
  }

  #content {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  #nickname {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    -webkit-app-region: no-drag;
  }
  #status {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: -2px;
    -webkit-app-region: no-drag;
  }
  #mood-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-dim);
    margin-right: 5px;
    vertical-align: baseline;
    transition: background 0.35s ease, box-shadow 0.35s ease;
  }

  #panel.expanded {
    border-radius: 20px;
  }
  #panel.expanded #body {
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 10px;
    padding-top: 4px;
  }
  #panel.expanded #avatar-wrap {
    flex: 0 0 auto;
    width: 240px;
    height: 340px;
    border-radius: 22px;
    font-size: 64px;
    /* 舞台光晕替代硬紫底：角色站在光里，不再"困"在色块盒子里 */
    background: radial-gradient(130px 96px at 50% 38%, rgba(159, 144, 255, 0.30), transparent 72%);
    box-shadow: 0 0 36px rgba(124, 111, 255, 0.20);
    animation: none;
  }
  #panel.expanded #avatar-wrap img {
    object-fit: contain;
    width: 100%;
    height: 100%;
  }
  #panel.expanded #content {
    width: 100%;
    align-items: center;
    text-align: center;
    gap: 4px;
  }
  #panel.expanded #notifications {
    flex: 1 1 auto;
    width: 100%;
    min-height: 0;
  }
  @media (prefers-reduced-motion: reduce) {
    #panel:not(.expanded) #avatar-wrap,
    #avatar-wrap.listening {
      animation: none;
      transition: none;
    }
  }
  .btn-toggle-size {
    font-size: 12px;
  }

  #notifications {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding-right: 2px;
    -webkit-app-region: no-drag;
  }

  #thinking-box {
    width: 100%;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-left: 3px solid var(--accent);
    border-radius: 10px;
    padding: 7px 10px;
    font-size: 11.5px;
    line-height: 1.5;
    color: var(--text);
    -webkit-app-region: no-drag;
  }
  #panel:not(.expanded) #thinking-box {
    display: none;
  }

  /* 互动即时反馈气泡：点互动工具后角色在悬浮窗内先开口 */
  #interact-bubble {
    position: absolute;
    right: 10px;
    top: 74px;
    max-width: 170px;
    background: rgba(26, 28, 38, 0.97);
    border: 1px solid rgba(155, 140, 255, 0.35);
    border-radius: 12px;
    padding: 8px 11px;
    font-size: 12px;
    line-height: 1.5;
    color: var(--text);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    opacity: 0;
    transform: translateY(6px) scale(0.96);
    transition: opacity 0.22s ease, transform 0.22s ease;
    z-index: 25;
    pointer-events: none;
    -webkit-app-region: no-drag;
  }
  #interact-bubble::before {
    content: "";
    position: absolute;
    left: -6px;
    top: 16px;
    width: 10px;
    height: 10px;
    background: rgba(26, 28, 38, 0.97);
    border-left: 1px solid rgba(155, 140, 255, 0.35);
    border-bottom: 1px solid rgba(155, 140, 255, 0.35);
    transform: rotate(45deg);
  }
  #interact-bubble.show {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  #panel:not(.expanded) #interact-bubble {
    right: 4px;
    top: 46px;
    max-width: 150px;
    font-size: 11px;
    padding: 6px 9px;
  }
  #panel:not(.expanded) #interact-bubble::before { display: none; }
  #notifications::-webkit-scrollbar { width: 4px; }
  #notifications::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

  .note {
    position: relative;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    border-left-width: 3px;
    border-radius: 10px;
    padding: 6px 8px;
    font-size: 11.5px;
    line-height: 1.45;
    color: var(--text);
    transition: opacity 0.3s ease;
  }
  .note.level-info { border-left-color: var(--info); }
  .note.level-success { border-left-color: var(--success); }
  .note.level-warn { border-left-color: var(--warn); }
  .note.level-error { border-left-color: var(--error); }
  .note-title {
    font-weight: 600;
    font-size: 11.5px;
    color: var(--text);
    margin-bottom: 2px;
  }
  .note-msg {
    color: var(--text);
    opacity: 0.92;
    word-break: break-word;
  }
  .note-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 5px;
  }
  .note-action {
    background: rgba(124, 111, 255, 0.18);
    border: 1px solid rgba(124, 111, 255, 0.4);
    color: #d5d0ff;
    font-size: 10.5px;
    padding: 2px 7px;
    border-radius: 6px;
    cursor: pointer;
  }
  .note-action:hover { background: rgba(124, 111, 255, 0.3); }
  .note.dismissed { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
  <div id="panel">
    <div id="drag-handle">
      <div class="dot" title="墨小灵"></div>
      <div id="toolbar">
        <button class="tool-btn btn-toggle-size" id="btn-expand" title="展开陪伴模式">⛶</button>
        <button class="tool-btn" id="btn-back" title="回到主窗口">⌂</button>
        <button class="tool-btn" id="btn-hide" title="隐藏悬浮窗">−</button>
      </div>
    </div>
    <div id="body">
      <div id="avatar-wrap" title="点击打开互动菜单" role="button" tabindex="0" aria-haspopup="menu" aria-expanded="false" aria-controls="interact-menu">
        <img id="avatar-image" alt="角色立绘" hidden />
        <div id="avatar-live2d"></div>
        <span id="avatar-text">灵</span>
      </div>
      <div id="interact-menu" class="interact-menu" role="menu" aria-label="互动工具" hidden>
        <button type="button" data-action="chat" data-chat="摸摸头" data-line="唔…好舒服~（蹭蹭你的手心）" data-mood="happy">✋ 摸摸头</button>
        <button type="button" data-action="chat" data-chat="戳戳脸" data-line="呀！别戳啦，痒痒的~（捂住脸偷看）" data-mood="shy">👆 戳戳脸</button>
        <button type="button" data-action="chat" data-chat="击掌" data-line="啪！好耶~击掌成功！（眼睛亮晶晶）" data-mood="happy">🤝 击个掌</button>
        <button type="button" data-action="chat" data-chat="请你吃甜点" data-line="诶？给我的吗！谢谢~（小口小口地吃）" data-mood="warm">🍰 投喂甜点</button>
        <button type="button" data-action="chat" data-chat="夸夸你" data-line="诶嘿嘿…被你这么夸，开心到转圈圈~" data-mood="shy">✨ 夸夸我</button>
        <button type="button" data-action="chat" data-chat="说晚安" data-line="晚安呀~明天也要一起哦。（轻轻挥手）" data-mood="warm">🌙 说晚安</button>
        <button type="button" data-action="chat" data-chat="你好呀~" data-line="嗨~你来啦！等你有一会儿了哦。" data-mood="happy">👋 打个招呼</button>
        <button type="button" data-action="chat" data-chat="今天有什么想聊的吗？" data-line="嗯…想听故事，还是想知道我今天的小发现？" data-mood="curious">💬 今天聊什么</button>
        <button type="button" data-action="chat" data-chat="看看你现在的造型" data-line="（转了个圈）怎么样？这是我今天的造型哦~" data-mood="curious">🎨 看看造型</button>
        <button type="button" data-action="chat" data-chat="抱抱我" data-line="诶嘿~被抱住了！好温暖…（回抱住你）" data-mood="warm">🫂 抱抱我</button>
        <button type="button" data-action="chat" data-chat="猜猜我的心情" data-line="唔…让我猜猜——你是不是有点想我了？" data-mood="curious">🔮 猜猜心情</button>
        <button type="button" data-action="chat" data-chat="讲个故事" data-line="从前有只小狐狸…（讲到一半眨眨眼）剩下的明天再讲，保留神秘感~" data-mood="calm">📖 讲个故事</button>
        <div class="menu-sep"></div>
        <button type="button" data-action="main">⌂ 回到主窗口</button>
        <button type="button" data-action="hide">− 隐藏悬浮窗</button>
      </div>
      <div id="content">
        <div id="nickname">墨小灵</div>
        <div id="status"><span id="mood-dot"></span><span id="status-text">在线 · 等待指令</span></div>
        <div id="thinking-box" hidden></div>
        <div id="notifications"></div>
      </div>
      <div id="interact-bubble" hidden></div>
    </div>
  </div>

<script>
  const notifications = new Map();
  const MAX_NOTES = 12;
  const box = document.getElementById("notifications");
  const statusEl = document.getElementById("status");
  const nicknameEl = document.getElementById("nickname");
  const avatarEl = document.getElementById("avatar-wrap");
  const avatarText = document.getElementById("avatar-text");
  let characterUpdateVersion = 0;
  let live2dReady = false;
  let currentMood = "";

  function formatExpiry(expiresAt) {
    if (!Number.isFinite(expiresAt)) return "";
    const remain = Math.max(0, expiresAt - Date.now());
    const sec = Math.ceil(remain / 1000);
    if (sec <= 0) return "";
    if (sec < 60) return sec + "s";
    const m = Math.floor(sec / 60);
    return m + "m";
  }

  function removeNote(id) {
    const el = document.querySelector(`.note[data-id="${id}"]`);
    if (!el) return;
    el.classList.add("dismissed");
    setTimeout(() => {
      notifications.delete(id);
      if (el.parentNode) el.parentNode.removeChild(el);
    }, 280);
  }

  function renderNote(note) {
    const existing = document.querySelector(`.note[data-id="${note.id}"]`);
    if (existing) return;
    const div = document.createElement("div");
    div.className = `note level-${note.level}`;
    div.dataset.id = note.id;
    const ttl = formatExpiry(note.expires_at);
    let titleHtml = "";
    if (note.title) {
      titleHtml = `<div class="note-title">${escapeHtml(note.title)}${ttl ? ` <span style="float:right;color:var(--text-dim);font-weight:400;opacity:0.7">${ttl}</span>` : ""}</div>`;
    }
    const msgHtml = note.message ? `<div class="note-msg">${escapeHtml(note.message)}</div>` : "";
    let actionsHtml = "";
    if (Array.isArray(note.actions) && note.actions.length) {
      const btns = note.actions.map((a, i) => {
        const aid = `${note.id}-${i}`;
        setTimeout(() => {
          const btn = document.getElementById(aid);
          if (btn) btn.addEventListener("click", () => triggerAction(note.id, i));
        }, 0);
        return `<button class="note-action" id="${aid}">${escapeHtml(a.label)}</button>`;
      }).join("");
      actionsHtml = `<div class="note-actions">${btns}</div>`;
    }
    div.innerHTML = titleHtml + msgHtml + actionsHtml;
    if (box.firstChild) box.insertBefore(div, box.firstChild);
    else box.appendChild(div);
    notifications.set(note.id, note);
    while (notifications.size > MAX_NOTES) {
      const oldest = Array.from(notifications.keys())[0];
      removeNote(oldest);
    }
    if (Number.isFinite(note.expires_at) && note.expires_at > Date.now()) {
      setTimeout(() => removeNote(note.id), Math.min(note.expires_at - Date.now(), 3600_000));
    } else if (!note.actions || note.actions.length === 0) {
      setTimeout(() => removeNote(note.id), 10_000);
    }
  }

  function escapeHtml(str) {
    if (typeof str !== "string") return "";
    return str.replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  function triggerAction(noteId, actionIndex) {
    window.floating.sendNotificationAction(noteId, actionIndex)
      .then(() => removeNote(noteId))
      .catch((error) => console.error("Could not handle notification action:", error));
  }

  const interactMenu = document.getElementById("interact-menu");
  const MOOD_COLORS = {
    calm: "#7c8cf8",
    happy: "#ffd166",
    curious: "#7dd3fc",
    surprised: "#f8a5ff",
    worried: "#ff9f6e",
    shy: "#ff8fab",
    warm: "#ffb84d",
    caring: "#6ee7b7",
  };
  const bubbleEl = document.getElementById("interact-bubble");
  let bubbleTimer = null;

  // 摸头奖励（轻量游戏化）：本机计数，每 5 次触发一次奖励台词
  const HEADPAT_KEY = "moling_floating_headpat_count";
  function headpatFeedback() {
    let count = 0;
    try { count = Number(localStorage.getItem(HEADPAT_KEY) || "0") || 0; } catch { /* 忽略 */ }
    count += 1;
    try { localStorage.setItem(HEADPAT_KEY, String(count)); } catch { /* 忽略 */ }
    if (count % 5 === 0) {
      return { line: `（被你摸了 ${count} 次啦~）今天也最喜欢你！蹭蹭~`, mood: "happy" };
    }
    return { line: "唔…好舒服~（蹭蹭你的手心）", mood: "happy" };
  }

  // 互动即时反馈：悬浮窗内角色先开口（台词气泡 + 情绪表情联动），
  // 同时 sendChat 让主墨灵完整回应（对话区正式回复 + 后端情绪）。
  function showInteractFeedback(line, moodKey) {
    if (!bubbleEl || typeof line !== "string" || !line.trim()) return;
    bubbleEl.textContent = line.trim();
    bubbleEl.hidden = false;
    bubbleEl.classList.remove("show");
    void bubbleEl.offsetWidth; // 强制 reflow 触发过渡
    bubbleEl.classList.add("show");
    const color = MOOD_COLORS[moodKey] || "";
    if (color) {
      avatarEl.style.setProperty("--mood-halo", color);
      const dot = document.getElementById("mood-dot");
      dot.style.background = color;
      dot.style.boxShadow = `0 0 10px ${color}`;
      window.MolingLive2D?.setExpressionByMood(moodKey);
    }
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => {
      bubbleEl.classList.remove("show");
      setTimeout(() => { bubbleEl.hidden = true; }, 240);
    }, 2600);
  }

  function closeInteractMenu() {
    interactMenu.hidden = true;
    avatarEl.setAttribute("aria-expanded", "false");
    document.removeEventListener("click", closeInteractMenu);
  }

  function setInteractMenuOpen(open) {
    interactMenu.hidden = !open;
    avatarEl.setAttribute("aria-expanded", String(open));
    document.removeEventListener("click", closeInteractMenu);
    if (open) setTimeout(() => document.addEventListener("click", closeInteractMenu), 0);
  }

  avatarEl.addEventListener("click", (event) => {
    event.stopPropagation();
    // 生活状态机：互动 = 唤醒（自由时间/低电被叫醒）
    window.floating.lifeWake?.().catch(() => {});
    setInteractMenuOpen(interactMenu.hidden);
  });
  avatarEl.addEventListener("keydown", (event) => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      setInteractMenuOpen(interactMenu.hidden);
    } else if (event.key === "Escape" && !interactMenu.hidden) {
      event.preventDefault();
      closeInteractMenu();
      avatarEl.focus();
    }
  });
  interactMenu.addEventListener("click", (event) => {
    event.stopPropagation();
    const item = event.target.closest("button[data-action]");
    if (!item) return;
    const action = item.dataset.action;
    if (action === "chat") {
      let line = item.dataset.line;
      let mood = item.dataset.mood;
      if (item.dataset.chat === "摸摸头") {
        const reward = headpatFeedback();
        line = reward.line;
        mood = reward.mood;
      }
      showInteractFeedback(line, mood);
      window.floating.lifeWake?.().catch(() => {});
      window.floating.sendChat(item.dataset.chat).catch((error) => {
        console.error("Could not send chat from floating window:", error);
      });
      setInteractMenuOpen(false);
      return;
    }
    setInteractMenuOpen(false);
    if (action === "main") {
      window.floating.showMainWindow().catch((error) => {
        console.error("Could not show the main window:", error);
      });
    } else if (action === "hide") {
      window.floating.hideFloating().catch((error) => {
        console.error("Could not hide the floating window:", error);
      });
    }
  });

  document.getElementById("btn-hide").addEventListener("click", () => {
    window.floating.hideFloating().catch((error) => {
      console.error("Could not hide the floating window:", error);
    });
  });

  document.getElementById("btn-back").addEventListener("click", () => {
    window.floating.showMainWindow().catch((error) => {
      console.error("Could not show the main window:", error);
    });
  });

  const expandButton = document.getElementById("btn-expand");
  const panel = document.getElementById("panel");
  let expanded = false;
  expandButton.addEventListener("click", () => {
    expanded = !expanded;
    panel.classList.toggle("expanded", expanded);
    expandButton.textContent = expanded ? "⤡" : "⛶";
    expandButton.title = expanded ? "收起为通知模式" : "展开陪伴模式";
    const request = expanded
      ? window.floating.expandFloating()
      : window.floating.collapseFloating();
    request.catch((error) => {
      console.error("Could not resize the floating window:", error);
    });
    // 注意：不在点击时立即显示/隐藏 Live2D——窗口 setBounds 是异步的，
    // 立即切换会让角色在窗口 resize 完成前被裁切/拉伸（"格子内外横跳"）。
    // 改为等窗口 resize 稳定后由 onFloatingResize 统一处理。
  });

  // 窗口尺寸稳定后再校准 Live2D 位置与显隐，避免过渡期角色跳动/变形
  let resizeTimer = null;
  function onFloatingResize() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      syncLive2dVisibility();
      if (panel.classList.contains("expanded") && live2dReady) {
        window.MolingLive2D.setCharacterSide("center", live2dBox, {
          heightRatio: 0.5,
          widthRatio: 0.4,
        });
      }
    }, 180);
  }
  window.addEventListener("resize", onFloatingResize);

  function handleNotification(note) {
    if (!note || typeof note !== "object") return;
    renderNote(note);
  }

  function applyCharacter(character) {
    if (!character || typeof character !== "object") return;
    const updateVersion = ++characterUpdateVersion;
    const image = document.getElementById("avatar-image");
    const text = document.getElementById("avatar-text");
    const nickname = document.getElementById("nickname");
    const status = document.getElementById("status");
    const statusText = document.getElementById("status-text");
    const moodDot = document.getElementById("mood-dot");
    const MOOD_COLORS = {
      calm: "#7c8cf8",
      happy: "#ffd166",
      curious: "#7dd3fc",
      surprised: "#f8a5ff",
      worried: "#ff9f6e",
      shy: "#ff8fab",
      warm: "#ffb84d",
      caring: "#6ee7b7",
    };
    if (character.nickname) {
      nickname.textContent = character.nickname;
      text.textContent = character.nickname.slice(0, 1);
      image.alt = `${character.nickname}角色立绘`;
    }
    image.onerror = () => {
      if (updateVersion !== characterUpdateVersion) return;
      if (
        !image.dataset.baseFallbackTried &&
        typeof character.avatarFallbackDataUrl === "string" &&
        character.avatarFallbackDataUrl &&
        character.avatarFallbackDataUrl !== image.src
      ) {
        image.dataset.baseFallbackTried = "true";
        image.src = character.avatarFallbackDataUrl;
        return;
      }
      image.hidden = true;
      image.removeAttribute("src");
      text.hidden = false;
      statusText.textContent = "角色立绘无法显示 · 在线 · 等待指令";
    };
    delete image.dataset.baseFallbackTried;
    if (typeof character.avatarDataUrl === "string" && character.avatarDataUrl) {
      image.src = character.avatarDataUrl;
      image.hidden = false;
      text.hidden = true;
    } else {
      image.hidden = true;
      image.removeAttribute("src");
      text.hidden = false;
    }
    const moodKey = String(character.moodKey || "").toLowerCase();
    currentMood = moodKey;
    if (typeof live2dReady !== "undefined" && live2dReady && moodKey) {
      window.MolingLive2D.setExpressionByMood(moodKey);
    }
    const moodColor = MOOD_COLORS[moodKey] || "";
    avatarEl.style.setProperty("--mood-halo", moodColor || "#7c6fff");
    moodDot.style.background = moodColor || "var(--text-dim)";
    moodDot.style.boxShadow = moodColor ? `0 0 10px ${moodColor}` : "none";
    statusText.textContent = character.moodLabel
      ? `模拟状态 · ${character.moodLabel}`
      : "在线 · 等待指令";
    const thinkingBox = document.getElementById("thinking-box");
    if (typeof character.moodReason === "string" && character.moodReason.trim()) {
      thinkingBox.textContent = `在想：${character.moodReason.trim()}`;
      thinkingBox.hidden = false;
    } else {
      thinkingBox.textContent = "";
      thinkingBox.hidden = true;
    }
  }

  window.floating.onNotification(handleNotification);
  window.floating.onCharacterUpdated(applyCharacter);
  window.floating.onSpeechState((speaking) => {
    avatarEl.classList.toggle("listening", speaking);
    // Live2D 口型联动：说话张嘴、结束闭嘴
    if (speaking) {
      window.MolingLive2D?.startTalking();
    } else {
      window.MolingLive2D?.stopTalking();
    }
  });

  // ── 墨灵生活状态机（悬浮窗消费：睡觉/低电/起床过场）────────────────
  const LIFE_BEDTIME_TEXT = { bed: "躺床", pod: "休眠舱", door: "开门出去" };
  const LIFE_STATUS_TEXT = {
    active: "在线 · 等待指令",
    free: "",
    low: "电量低 · 趴着休息",
    sleeping: "去睡觉了…",
    waking: "醒来了",
    waking_clean: "起床了",
    waking_unclean: "诶？发生什么了…",
  };
  const LIFE_DIALOG_TEXT = {
    waking_clean: (b) =>
      `唔…早呀，你回来啦~（这次是${LIFE_BEDTIME_TEXT[b] || "躺床"}睡的呢）`,
    waking_unclean: () => "诶！？刚才是不是…有人把我抱走了？",
  };
  const LIFE_DISPLAY_CLASS = {
    sleeping: "life-sleeping",
    low: "life-low",
    waking: "life-waking",
    waking_clean: "life-waking-clean",
    waking_unclean: "life-waking-unclean",
  };

  function applyFloatingLife(payload) {
    if (!payload || typeof payload !== "object") return;
    const st = payload.state || "active";
    const statusText = document.getElementById("status-text");
    // 1) 状态文字
    let label = LIFE_STATUS_TEXT[st] || "";
    if (st === "free") {
      const act =
        payload.activity === "read"
          ? "在看书"
          : payload.activity === "stare"
            ? "在发呆"
            : "在睡觉";
      label = `自由时间 · ${act}`;
    } else if (st === "active" && payload.prev === "free") {
      label = "醒来了";
    }
    if (payload.batteryEvt === "battery_low" && st !== "low" && payload.battery) {
      label += ` · ${payload.battery.percent}%`;
    } else if (
      payload.batteryEvt === "battery_charging" &&
      payload.battery
    ) {
      label = `充电中 · ${payload.battery.percent}%`;
    }
    if (label && statusText) statusText.textContent = label;
    // 2) 角色区生活态 class
    for (const c of Object.values(LIFE_DISPLAY_CLASS)) avatarEl.classList.remove(c);
    if (st === "free" && payload.activity === "sleep") {
      avatarEl.classList.add(LIFE_DISPLAY_CLASS.sleeping);
    } else if (LIFE_DISPLAY_CLASS[st]) {
      avatarEl.classList.add(LIFE_DISPLAY_CLASS[st]);
    }
    // 3) 起床台词气泡（复用互动反馈气泡）
    const text = LIFE_DIALOG_TEXT[st] ? LIFE_DIALOG_TEXT[st](payload.bedtime) : "";
    if (text) {
      showInteractFeedback(text, st === "waking_unclean" ? "surprised" : "warm");
    }
  }
  window.floating.onLifeEvent(applyFloatingLife);

  // ── 悬浮窗 Live2D 动态形象（沐莹）────────────────────────────
  const live2dBox = document.getElementById("avatar-live2d");

  function syncLive2dVisibility() {
    const isExpanded = panel.classList.contains("expanded");
    avatarEl.classList.toggle("expanded-live2d", isExpanded && live2dReady);
  }

  async function initFloatingLive2D() {
    try {
      const ok = await window.MolingLive2D.init(live2dBox, {
        modelUrl:
          "moling://local/model/狐仙花嫁/狐仙花嫁/狐仙花嫁.model3.json",
        fixedSize: { width: 240, height: 340 },
      });
      if (!ok) return;
      live2dReady = true;
      // 悬浮窗角色高度 50%：为模型待机动画（呼吸/转身/摆臂）留出摆动余量，
      // 避免角色头/耳/手在循环动画时被 avatar 圆角盒子裁切（"格子内外横跳"）。
      window.MolingLive2D.setCharacterSide("center", live2dBox, {
        heightRatio: 0.5,
        widthRatio: 0.4,
      });
      if (currentMood) {
        window.MolingLive2D.setExpressionByMood(currentMood);
      }
      syncLive2dVisibility();
    } catch (error) {
      console.error("Live2D init failed:", error);
    }
  }
  initFloatingLive2D();

  (function initDemo() {
    const welcome = {
      id: "welcome-" + Date.now(),
      title: "已就绪",
      message: "你好！我是墨小灵，悬浮窗已启动。拖拽可移动，点击头像打开主窗口。",
      level: "success",
      actions: [{ label: "知道了" }],
      expires_at: Date.now() + 12000,
      created_at: Date.now(),
    };
    renderNote(welcome);
  })();
</script>
</body>
</html>
