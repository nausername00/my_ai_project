<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#10131c" />
  <title>墨灵 · 移动陪伴</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 手机端 3.0 步骤② 游戏化界面：
       全屏墨灵舞台 + 顶部 HUD（心情/好感/电量）+ 底部工具栏 + 互动菜单 -->
  <div class="stage-shell" id="stageShell">
    <!-- 第三梯队 C：手机端 Live2D 角色舞台（模型从电脑后端 /v1/model/asset 按需加载）
         B 手机入侵：点击舞台 = 摸摸头（互动反馈 + 摸头奖励），情绪联动表情与光晕 -->
    <div class="avatar-stage" id="avatarStage" role="button" tabindex="0"
         aria-label="墨灵形象，点击摸摸头" title="点击摸摸头">
      <div id="live2d-stage" class="live2d-stage" hidden></div>
      <div class="avatar-fallback" id="avatarFallback" aria-hidden="true">墨</div>
      <div id="stageBubble" class="stage-bubble" role="status" hidden></div>
    </div>
    <!-- 游戏 HUD：身份 + 心情 / 好感 / 电量（好感为本地互动雏形，电量读真电池） -->
    <div class="hud" id="hud" aria-hidden="false">
      <div class="hud-left">
        <span class="dot" id="statusDot"></span>
        <strong id="companionName">墨灵</strong>
        <span class="model" id="modelLabel">…</span>
      </div>
      <div class="hud-right">
        <span class="hud-chip" id="hudMood" title="心情"><span class="hud-icon" id="hudMoodIcon">◡</span><span id="hudMoodText">平静</span></span>
        <span class="hud-chip" id="hudLove" title="好感"><span class="hud-icon">❤</span><span id="hudLoveText">萌新</span><span class="hud-bar"><i id="hudLoveBar"></i></span></span>
        <span class="hud-chip" id="hudBattery" title="电量"><span class="hud-icon" id="hudBatteryIcon">🔋</span><span id="hudBatteryText">--%</span></span>
        <button type="button" class="gear" id="modeBtn" aria-label="切换陪伴/聊天模式" title="切换模式">🌙</button>
        <button type="button" class="gear" id="settingsBtn" aria-label="设置" title="设置">⚙</button>
      </div>
    </div>
  </div>

  <div class="settings" id="settingsPanel" hidden>
    <div class="setting-row">
      <label for="serverInput">服务器地址（App 内必填：电脑局域网 IP + :8000；浏览器打开本页可留空自动同源）</label>
      <div class="token-row">
        <input type="text" id="serverInput" placeholder="http://192.168.1.5:8000" autocomplete="off" spellcheck="false" />
        <button type="button" id="serverSave">保存</button>
      </div>
    </div>
    <div class="setting-row">
      <label for="tokenInput">API Token（非本机访问必需；仅存本机浏览器）</label>
      <div class="token-row">
        <input type="password" id="tokenInput" placeholder="MOLING_API_TOKEN" autocomplete="off" />
        <button type="button" id="tokenSave">保存</button>
      </div>
    </div>
    <div class="setting-row">
      <label for="testConnBtn">连接自检：探测电脑后端是否可达，并给出分层排查提示</label>
      <div class="token-row">
        <button type="button" id="testConnBtn">测试连接</button>
      </div>
      <p class="diag" id="testConnResult" role="status"></p>
    </div>
    <div class="setting-row row-inline">
      <label for="notifyToggle">新回复系统通知（需 HTTPS/本机；HTTP 局域网不可用）</label>
      <button type="button" class="toggle" id="notifyToggle" role="switch" aria-checked="false">关</button>
    </div>
    <div class="setting-row row-inline">
      <label for="wakeToggle">语音接收（说唤醒词「墨灵墨灵」→ 墨灵回应 → 再对我说一句，自动进对话；需 HTTPS/本机）</label>
      <button type="button" class="toggle" id="wakeToggle" role="switch" aria-checked="false">关</button>
    </div>
    <div class="setting-row">
      <label for="wakeWord">唤醒词（可自定义，如：墨灵墨灵 / 墨灵在么）</label>
      <input type="text" id="wakeWord" value="墨灵墨灵" maxlength="12" autocomplete="off" spellcheck="false" />
    </div>
    <div class="setting-row row-inline">
      <label for="clearBtn">清空本机聊天记录（不影响电脑端记忆）</label>
      <button type="button" class="danger" id="clearBtn">清空</button>
    </div>
  </div>

  <main class="chat" id="chatLog" aria-live="polite"></main>

  <!-- 互动工具菜单：底部工具栏「互动」弹出（本地即时反馈，台词与桌面悬浮窗一致） -->
  <div class="interact-menu" id="interactMenu" role="menu" aria-label="互动工具" hidden>
    <button type="button" data-prompt="摸摸头" data-line="唔…好舒服~（蹭蹭你的手心）" data-mood="happy">✋ 摸摸头</button>
    <button type="button" data-prompt="抱抱我" data-line="诶嘿~被抱住了！好温暖…（回抱住你）" data-mood="warm">🫂 抱抱我</button>
    <button type="button" data-prompt="夸夸我" data-line="诶嘿嘿…被你这么夸，开心到转圈圈~" data-mood="shy">✨ 夸夸我</button>
    <button type="button" data-prompt="投喂甜点" data-line="诶？给我的吗！谢谢~（小口小口地吃）" data-mood="warm">🍰 投喂甜点</button>
    <button type="button" data-prompt="说晚安" data-line="晚安呀~明天也要一起哦。（轻轻挥手）" data-mood="warm">🌙 说晚安</button>
    <button type="button" data-prompt="今天聊什么" data-line="嗯…想听故事，还是想知道我今天的小发现？" data-mood="curious">💬 今天聊什么</button>
  </div>

  <!-- 手机端 3.0 步骤④ 养成+收集：时装图鉴面板（12 套，换装成功点亮） -->
  <div class="wardrobe-panel" id="wardrobePanel" role="dialog" aria-label="时装图鉴" hidden>
    <div class="wardrobe-head">
      <strong>🪞 时装图鉴</strong>
      <span class="wardrobe-progress" id="wardrobeProgress">0/12</span>
    </div>
    <p class="wardrobe-tip">聊天里说「换上星夜 / 换上深海 / 换上鎏金…」换装成功即可收集，点亮全部 12 套有惊喜~</p>
    <div class="wardrobe-achievements" id="wardrobeAchievements"></div>
    <div class="wardrobe-grid" id="wardrobeGrid"></div>
  </div>

  <nav class="dock" id="dock" aria-label="工具栏">
    <button type="button" class="dock-btn dock-chat" id="dockChat">💬 对话</button>
    <button type="button" class="dock-btn dock-interact" id="interactBtn" aria-haspopup="menu" aria-expanded="false">✋ 互动</button>
    <button type="button" class="dock-btn dock-wardrobe" id="dockWardrobe">🪞 图鉴</button>
    <button type="button" class="dock-btn dock-settings" id="dockSettings">⚙ 设置</button>
  </nav>

  <form class="composer" id="composer">
    <textarea id="input" rows="1" placeholder="输入消息…" autocomplete="off"></textarea>
    <button type="button" class="mic" id="micBtn" aria-label="语音输入" title="语音输入">🎤</button>
    <button type="submit" id="sendBtn" aria-label="发送">发送</button>
  </form>

  <script src="vendor/live2dcubismcore.min.js"></script>
  <script src="vendor/live2d-runtime.js"></script>
  <script src="app.js"></script>
</body>
</html>
